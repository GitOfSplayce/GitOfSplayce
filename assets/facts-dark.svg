<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-label="Le saviez-vous ?">
<title>Le saviez-vous ?</title>
<defs><clipPath id="card"><rect width="840" height="380" rx="12"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.m{fill:#9198a1}
.h{font-size:15px;font-weight:600}
.s{font-size:12px}
.xs{font-size:11px}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{transform:scale(0)}}
.emoji{font-size:18px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="839" height="379" rx="12" fill="#0d1117" stroke="#3d444d"/>

<text x="24" y="36" class="h">Le saviez-vous ?</text>
<text x="816" y="36" class="m s" text-anchor="end">sur les 12 derniers mois, tous projets confondus</text>
<g style="animation:fade .6s ease-out 0ms backwards">
  <rect x="24" y="56" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="56" cy="102" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="56" y="108.5" text-anchor="middle" class="emoji">🌙</text>
  <text x="86" y="94" style="font-size:22px;font-weight:700">2,2 %</text>
  <text x="86" y="114" style="font-size:12.5px;font-weight:600">des commits la nuit</text>
  <text x="86" y="132" class="m xs">entre 22 h et 6 h</text>
</g>
<g style="animation:fade .6s ease-out 70ms backwards">
  <rect x="292" y="56" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="324" cy="102" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="324" y="108.5" text-anchor="middle" class="emoji">🛋️</text>
  <text x="354" y="94" style="font-size:22px;font-weight:700">2,2 %</text>
  <text x="354" y="114" style="font-size:12.5px;font-weight:600">des commits le week-end</text>
  <text x="354" y="132" class="m xs">samedi et dimanche</text>
</g>
<g style="animation:fade .6s ease-out 140ms backwards">
  <rect x="560" y="56" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="592" cy="102" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="592" y="108.5" text-anchor="middle" class="emoji">📅</text>
  <text x="622" y="94" style="font-size:22px;font-weight:700">mercredi</text>
  <text x="622" y="114" style="font-size:12.5px;font-weight:600">jour le plus productif</text>
  <text x="622" y="132" class="m xs">pic d’activité vers 16 h</text>
</g>
<g style="animation:fade .6s ease-out 210ms backwards">
  <rect x="24" y="160" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="56" cy="206" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="56" y="212.5" text-anchor="middle" class="emoji">🔥</text>
  <text x="86" y="198" style="font-size:22px;font-weight:700">154 commits</text>
  <text x="86" y="218" style="font-size:12.5px;font-weight:600">en une seule journée</text>
  <text x="86" y="236" class="m xs">le 14 octobre 2026</text>
</g>
<g style="animation:fade .6s ease-out 280ms backwards">
  <rect x="292" y="160" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="324" cy="206" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="324" y="212.5" text-anchor="middle" class="emoji">📈</text>
  <text x="354" y="198" style="font-size:22px;font-weight:700">12 jours</text>
  <text x="354" y="218" style="font-size:12.5px;font-weight:600">de série record</text>
  <text x="354" y="236" class="m xs">au moins un commit par jour</text>
</g>
<g style="animation:fade .6s ease-out 350ms backwards">
  <rect x="560" y="160" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="592" cy="206" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="592" y="212.5" text-anchor="middle" class="emoji">🚀</text>
  <text x="622" y="198" style="font-size:22px;font-weight:700">lummea-play</text>
  <text x="622" y="218" style="font-size:12.5px;font-weight:600">projet le plus actif</text>
  <text x="622" y="236" class="m xs">417 commits en 30 jours</text>
</g>
<g style="animation:fade .6s ease-out 420ms backwards">
  <rect x="24" y="264" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="56" cy="310" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="56" y="316.5" text-anchor="middle" class="emoji">🏛️</text>
  <text x="86" y="302" style="font-size:22px;font-weight:700">ACE_EDITOR</text>
  <text x="86" y="322" style="font-size:12.5px;font-weight:600">le doyen des projets</text>
  <text x="86" y="340" class="m xs">lancé en avril 2023</text>
</g>
<g style="animation:fade .6s ease-out 490ms backwards">
  <rect x="292" y="264" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="324" cy="310" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="324" y="316.5" text-anchor="middle" class="emoji">🤖</text>
  <text x="354" y="302" style="font-size:22px;font-weight:700">10 / 46</text>
  <text x="354" y="322" style="font-size:12.5px;font-weight:600">projets prêts pour l’IA</text>
  <text x="354" y="340" class="m xs">CLAUDE.md ou AGENTS.md</text>
</g>
<g style="animation:fade .6s ease-out 560ms backwards">
  <rect x="560" y="264" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="592" cy="310" r="19" fill="#a371f7" fill-opacity=".12"/>
  <text x="592" y="316.5" text-anchor="middle" class="emoji">🧪</text>
  <text x="622" y="302" style="font-size:22px;font-weight:700">865</text>
  <text x="622" y="322" style="font-size:12.5px;font-weight:600">fichiers de tests</text>
  <text x="622" y="340" class="m xs">sur 10 101 fichiers au total</text>
</g>
</svg>
