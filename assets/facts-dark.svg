<g style="animation:fade .6s ease-out 560ms backwards">
  <rect x="560" y="264" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="592" cy="310" r="19" fill="#a371f7" fill-opacity=".12"/>
  <g transform="translate(582 300) scale(0.8333333333333334)" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>
  <text x="622" y="302" style="font-size:22px;font-weight:700">1 001</text>
  <text x="622" y="322" style="font-size:12.5px;font-weight:600">fichiers de tests</text>
  <text x="622" y="340" class="m xs">sur 11 124 fichiers au total</text>
