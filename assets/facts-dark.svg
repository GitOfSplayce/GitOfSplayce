  <text x="86" y="322" style="font-size:12.5px;font-weight:600">le doyen des projets</text>
  <text x="86" y="340" class="m xs">lancé en avril 2023</text>
</g>
<g style="animation:fade .6s ease-out 490ms backwards">
  <rect x="292" y="264" width="256" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-opacity=".6"/>
  <circle cx="324" cy="310" r="19" fill="#a371f7" fill-opacity=".12"/>
  <g transform="translate(314 300) scale(0.8333333333333334)" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></g>
  <text x="354" y="302" style="font-size:22px;font-weight:700">10 / 43</text>
  <text x="354" y="322" style="font-size:12.5px;font-weight:600">projets prêts pour l’IA</text>
  <text x="354" y="340" class="m xs">CLAUDE.md ou AGENTS.md</text>
