# Régénère README.md + assets/ chaque nuit à partir de l'API GitHub.
#
# Prérequis : un secret STATS_TOKEN (Settings → Secrets and variables → Actions)
# contenant un token capable de lire les dépôts privés du compte :
#   - fine-grained PAT créé depuis le compte GitOfSplayce, « All repositories »,
#     permissions Contents: Read-only + Metadata: Read-only
#   - ou un PAT classique avec le scope `repo`.
name: Mise à jour du README

on:
  schedule:
    - cron: '23 4 * * *' # tous les jours vers 5 h / 6 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - readme.config.json
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer le README
        run: node scripts/generate.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commiter si quelque chose a changé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour."
          else
            git commit -m "chore(stats): mise à jour du README"
            git push
          fi
